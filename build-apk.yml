name: Compilazione Automatica APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compila APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Scarica Codice Sorgente
        uses: actions/checkout@v4

      - name: Configura Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Compila APK Debug
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepara File APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/Inventario-Magazzino.apk

      - name: Carica APK come Artifact (Download Diretto)
        uses: actions/upload-artifact@v4
        with:
          name: Inventario-Magazzino-APK
          path: build_output/Inventario-Magazzino.apk
          retention-days: 30

      - name: Crea Release GitHub con APK scaricabile
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versione Magazzino 1.0.${{ github.run_number }}
          body: |
            ### Applicazione Magazzino & Giacenze Android (Offline)
            Scarica il file `Inventario-Magazzino.apk` qui sotto direttamente sul tuo smartphone e installalo.
          files: build_output/Inventario-Magazzino.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
