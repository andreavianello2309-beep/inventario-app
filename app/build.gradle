plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magazzino.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.magazzino.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Dipendenze minime per compilazione ultra-veloce e senza conflitti
}
